<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: #1f2733; color: #e6e9ee;
      font: 14px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    .card {
      width: 320px; padding: 28px 28px 24px; border-radius: 12px;
      background: #2a3442; box-shadow: 0 12px 40px rgba(0,0,0,.35);
    }
    h1 { margin: 0 0 18px; font-size: 18px; font-weight: 600; }
    input {
      width: 100%; box-sizing: border-box; padding: 10px 12px; margin-bottom: 12px;
      border: 1px solid #3c4858; border-radius: 8px; background: #1f2733; color: inherit;
      font-size: 14px; outline: none;
    }
    input:focus { border-color: #4f8cff; }
    button {
      width: 100%; padding: 10px; border: 0; border-radius: 8px;
      background: #4f8cff; color: #fff; font-size: 14px; cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: default; }
    .error { min-height: 20px; margin: 0 0 8px; color: #ff7b7b; font-size: 13px; }
  </style>
</head>
<body>
  <form class="card" id="loginForm">
    <h1>登录</h1>
    <input id="password" type="password" placeholder="密码" autocomplete="current-password" autofocus />
    <p class="error" id="error"></p>
    <button type="submit" id="submit">进入</button>
  </form>
  <script>
    (function () {
      var form = document.getElementById("loginForm");
      var input = document.getElementById("password");
      var error = document.getElementById("error");
      var submit = document.getElementById("submit");

      function nextTarget() {
        var next = new URLSearchParams(location.search).get("next") || "/";
        if (next.charAt(0) !== "/" || next.charAt(1) === "/") return "/";
        return next;
      }

      form.addEventListener("submit", function (ev) {
        ev.preventDefault();
        error.textContent = "";
        submit.disabled = true;
        fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: input.value }),
        }).then(function (res) {
          return res.json().then(function (body) {
            if (!res.ok || !body.ok) {
              throw new Error(body.error || ("HTTP " + res.status));
            }
            location.href = nextTarget();
          });
        }).catch(function (err) {
          error.textContent = err.message || String(err);
          submit.disabled = false;
          input.focus();
          input.select();
        });
      });
    })();
  </script>
</body>
</html>
