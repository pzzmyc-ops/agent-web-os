<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>终端测试</title>
  <link rel="stylesheet" href="/vendor/xterm/xterm.min.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 13px; color: #222; }
    button, input { font-family: inherit; }
    #desktop { position: relative; width: 100%; height: 100%; background: #1a3a5c; }
    .win {
      position: absolute; min-width: 360px; min-height: 240px; background: #f3f4f6; border-radius: 8px;
      box-shadow: 0 12px 40px rgba(0,0,0,.35), 0 0 0 1px rgba(0,0,0,.12);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .titlebar {
      height: 36px; display: flex; align-items: center; padding: 0 4px 0 12px; gap: 8px;
      background: linear-gradient(180deg, #ffffff, #eef2f7); border-bottom: 1px solid #d0d3d8; flex-shrink: 0;
    }
    .title { flex: 1; font-weight: 600; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .win-btn {
      width: 40px; height: 28px; border: 0; background: transparent; border-radius: 4px; cursor: pointer; color: #444;
    }
    .win-btn:hover { background: rgba(0,0,0,.08); }
    .win-btn.close:hover { background: #e81123; color: #fff; }
    .body { flex: 1; min-height: 0; display: flex; flex-direction: column; background: #fff; }
    .pathbar { display: flex; gap: 8px; align-items: center; padding: 8px; border-bottom: 1px solid #e4e7ec; }
    .pathbar button { height: 28px; padding: 0 10px; border: 1px solid #d0d3d8; background: #fff; border-radius: 4px; cursor: pointer; }
    .path { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .list { flex: 1; overflow: auto; padding: 6px; }
    .row { height: 32px; display: flex; align-items: center; padding: 0 8px; border-radius: 4px; cursor: default; }
    .row:hover, .row.selected { background: #d6e8ff; }
    .empty { color: #888; padding: 16px; }
    .term-host { flex: 1; min-height: 0; background: #012456; padding: 4px 2px 2px 6px; }
    .ctx-menu {
      position: fixed; z-index: 20; min-width: 180px; background: #fff; border: 1px solid #d8dde6;
      border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.18); padding: 4px;
    }
    .ctx-menu button {
      display: block; width: 100%; text-align: left; border: 0; background: transparent; height: 32px; border-radius: 4px; padding: 0 12px; cursor: pointer;
    }
    .ctx-menu button:hover { background: #e8f3ff; }
    .err { color: #c0392b; padding: 12px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div id="desktop">
    <div class="win" id="explorer" style="left:40px;top:40px;width:420px;height:520px;z-index:2">
      <div class="titlebar"><div class="title">文件</div></div>
      <div class="body">
        <div class="pathbar">
          <button type="button" id="up">上级</button>
          <div class="path" id="path"></div>
        </div>
        <div class="list" id="list"></div>
      </div>
    </div>
    <div id="terminals"></div>
  </div>
  <div id="menu" class="ctx-menu" hidden></div>
  <script src="/vendor/xterm/xterm.min.js"></script>
  <script src="/vendor/xterm/xterm-addon-fit.min.js"></script>
  <script>
    const listEl = document.getElementById("list");
    const pathEl = document.getElementById("path");
    const menuEl = document.getElementById("menu");
    const upEl = document.getElementById("up");
    let current = null;
    let z = 3;

    function hideMenu() {
      menuEl.hidden = true;
    }

    function showMenu(x, y, folder) {
      menuEl.hidden = false;
      menuEl.innerHTML = "";
      const btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = "在此处打开终端";
      btn.onclick = () => {
        hideMenu();
        openTerminal(folder);
      };
      menuEl.appendChild(btn);
      menuEl.style.left = Math.min(x, window.innerWidth - 200) + "px";
      menuEl.style.top = Math.min(y, window.innerHeight - 48) + "px";
    }

    async function load(folder) {
      const resp = await fetch("/dirs?path=" + encodeURIComponent(folder));
      const body = await resp.text();
      if (!resp.ok) throw new Error(body);
      const data = JSON.parse(body);
      current = data;
      pathEl.textContent = data.path;
      upEl.disabled = !data.parent;
      listEl.innerHTML = "";
      if (!data.dirs.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "没有子文件夹";
        listEl.appendChild(empty);
        return;
      }
      data.dirs.forEach((name) => {
        const row = document.createElement("div");
        row.className = "row";
        row.textContent = name;
        const child = /[\\/]$/.test(data.path) ? data.path + name : data.path + (data.path.indexOf("\\") >= 0 ? "\\" : "/") + name;
        row.dataset.path = child;
        row.ondblclick = () => load(child).catch(showError);
        row.oncontextmenu = (e) => {
          e.preventDefault();
          e.stopPropagation();
          showMenu(e.clientX, e.clientY, child);
        };
        listEl.appendChild(row);
      });
    }

    function showError(err) {
      listEl.innerHTML = "";
      const node = document.createElement("div");
      node.className = "err";
      node.textContent = err.message || String(err);
      listEl.appendChild(node);
    }

    function openTerminal(folder) {
      const win = document.createElement("div");
      win.className = "win";
      win.style.left = (480 + (z % 5) * 24) + "px";
      win.style.top = (60 + (z % 5) * 24) + "px";
      win.style.width = "760px";
      win.style.height = "480px";
      win.style.zIndex = String(++z);
      const name = folder.split(/[\\/]/).filter(Boolean).pop() || folder;
      win.innerHTML = '<div class="titlebar"><div class="title"></div><button type="button" class="win-btn close">关闭</button></div><div class="body"><div class="term-host"></div></div>';
      win.querySelector(".title").textContent = "终端 - " + name;
      document.getElementById("terminals").appendChild(win);
      const host = win.querySelector(".term-host");
      const term = new Terminal({
        cursorBlink: true,
        fontFamily: "Cascadia Mono, Consolas, monospace",
        fontSize: 14,
        ignoreBracketedPasteMode: true,
        theme: { background: "#012456", foreground: "#f2f2f2", cursor: "#f2f2f2" },
      });
      const fit = new FitAddon.FitAddon();
      term.loadAddon(fit);
      term.open(host);
      fit.fit();
      term.attachCustomKeyEventHandler((event) => {
        if (event.type !== "keydown" || !event.ctrlKey || event.altKey || event.metaKey || event.shiftKey) return true;
        if (event.key !== "c" && event.key !== "C") return true;
        if (!term.hasSelection()) return true;
        const text = term.getSelection();
        term.clearSelection();
        navigator.clipboard.writeText(text).catch((err) => { throw err; });
        return false;
      });
      const ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/api/terminal/ws?path=" + encodeURIComponent(folder));
      term.onData((data) => {
        if (ws.readyState === WebSocket.OPEN) ws.send(new TextEncoder().encode(data));
      });
      ws.onmessage = (ev) => term.write(ev.data);
      ws.onopen = () => {
        ws.send(JSON.stringify({ type: "resize", cols: term.cols, rows: term.rows }));
      };
      ws.onclose = (ev) => {
        term.write("\r\n[连接已关闭 " + ev.code + (ev.reason ? " " + ev.reason : "") + "]\r\n");
      };
      const observer = new ResizeObserver(() => {
        fit.fit();
        if (ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: "resize", cols: term.cols, rows: term.rows }));
        }
      });
      observer.observe(host);
      win.querySelector(".close").onclick = () => {
        observer.disconnect();
        ws.close();
        term.dispose();
        win.remove();
      };
      const bar = win.querySelector(".titlebar");
      bar.onpointerdown = (e) => {
        if (e.target.closest(".win-btn")) return;
        const startX = e.clientX;
        const startY = e.clientY;
        const origLeft = win.offsetLeft;
        const origTop = win.offsetTop;
        win.style.zIndex = String(++z);
        const move = (ev) => {
          win.style.left = (origLeft + ev.clientX - startX) + "px";
          win.style.top = (origTop + ev.clientY - startY) + "px";
        };
        const up = () => {
          bar.removeEventListener("pointermove", move);
          bar.removeEventListener("pointerup", up);
        };
        bar.setPointerCapture(e.pointerId);
        bar.addEventListener("pointermove", move);
        bar.addEventListener("pointerup", up);
      };
    }

    listEl.addEventListener("contextmenu", (e) => {
      if (e.target.closest(".row")) return;
      e.preventDefault();
      if (!current) return;
      showMenu(e.clientX, e.clientY, current.path);
    });
    upEl.onclick = () => {
      if (current && current.parent) load(current.parent).catch(showError);
    };
    document.addEventListener("click", (e) => {
      if (!e.target.closest("#menu")) hideMenu();
    });
    fetch("/home").then((resp) => resp.json()).then((data) => load(data.path)).catch(showError);
  </script>
</body>
</html>
