<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>浏览器外壳</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 13px; color: #222; }
    button, input { font-family: inherit; font-size: 13px; }
    #desktop { width: 100%; height: 100%; background: #1a3a5c; padding: 28px; }
    .win {
      width: 100%; height: 100%; background: #fff; border-radius: 8px;
      box-shadow: 0 12px 40px rgba(0,0,0,.35), 0 0 0 1px rgba(0,0,0,.12);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .titlebar {
      height: 36px; display: flex; align-items: center; padding: 0 12px;
      background: linear-gradient(180deg, #ffffff, #eef2f7); border-bottom: 1px solid #d0d3d8; flex-shrink: 0;
      font-weight: 600;
    }
    .tabs {
      height: 36px; display: flex; align-items: stretch; gap: 4px; padding: 4px 8px 0;
      background: #e8eaed; flex-shrink: 0; overflow: hidden;
    }
    .tablist { display: flex; gap: 4px; min-width: 0; flex: 1; overflow: hidden; }
    .tab {
      display: flex; align-items: center; gap: 6px; max-width: 220px; min-width: 0;
      padding: 0 8px 0 12px; border: 0; border-radius: 6px 6px 0 0; background: #d5d8dd; cursor: pointer;
    }
    .tab.on { background: #fff; }
    .tab span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .tab i {
      font-style: normal; width: 18px; height: 18px; line-height: 16px; text-align: center;
      border-radius: 4px; flex-shrink: 0;
    }
    .tab i:hover { background: rgba(0,0,0,.08); }
    .add {
      width: 28px; border: 0; background: transparent; border-radius: 6px; cursor: pointer; font-size: 18px;
    }
    .add:hover { background: rgba(0,0,0,.06); }
    .bar {
      height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 10px;
      border-bottom: 1px solid #e4e7ec; background: #f7f8fa; flex-shrink: 0;
    }
    .bar button {
      height: 28px; padding: 0 12px; border: 1px solid #d0d3d8; background: #fff; border-radius: 4px; cursor: pointer;
    }
    .bar button:disabled { opacity: .45; cursor: default; }
    .bar input {
      flex: 1; height: 28px; border: 1px solid #d0d3d8; border-radius: 4px; padding: 0 10px; outline: none;
    }
    .bar input:focus { border-color: #1a73e8; }
    .stage { flex: 1; min-height: 0; position: relative; background: #fff; }
    .stage iframe {
      position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff;
      visibility: hidden; pointer-events: none;
    }
    .stage iframe.show { visibility: visible; pointer-events: auto; z-index: 1; }
  </style>
</head>
<body>
  <div id="desktop">
    <div class="win">
      <div class="titlebar">浏览器</div>
      <div class="tabs">
        <div class="tablist" id="tablist"></div>
        <button type="button" class="add" id="add" title="新标签">+</button>
      </div>
      <div class="bar">
        <button type="button" id="back" disabled>后退</button>
        <button type="button" id="reload" disabled>刷新</button>
        <input id="url" type="text" spellcheck="false" placeholder="输入网址" />
        <button type="button" id="go">打开</button>
      </div>
      <div class="stage" id="stage"></div>
    </div>
  </div>
  <script>
    const STORE = "fm.browser-preview.tabs";
    const input = document.getElementById("url");
    const backBtn = document.getElementById("back");
    const reloadBtn = document.getElementById("reload");
    const tablist = document.getElementById("tablist");
    const stage = document.getElementById("stage");
    const tabs = [];
    let active = 0;

    function pageUrl(text) {
      const raw = text.trim();
      if (!raw) return "";
      if (/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(raw)) {
        if (!/^https?:\/\//i.test(raw)) throw new Error("只打开 http 或 https");
        return raw;
      }
      const host = raw.split("/")[0].split("?")[0].split("#")[0];
      const local = /^(localhost|127\.0\.0\.1)(:\d+)?$/i.test(host);
      return (local ? "http://" : "https://") + raw;
    }

    function tabLabel(tab) {
      const url = tab.index >= 0 ? tab.history[tab.index] : "";
      if (!url) return "新标签页";
      return new URL(url).host || url;
    }

    function current() {
      return tabs[active];
    }

    function remember() {
      sessionStorage.setItem(STORE, JSON.stringify({
        active,
        tabs: tabs.map((tab) => ({ history: tab.history, index: tab.index })),
      }));
    }

    function frameUrl(tab) {
      return tab.index >= 0 ? tab.history[tab.index] : "about:blank";
    }

    function paint() {
      const tab = current();
      input.value = tab.index >= 0 ? tab.history[tab.index] : "";
      tabs.forEach((item, i) => {
        item.frame.classList.toggle("show", i === active);
        const next = frameUrl(item);
        if (item.frame.getAttribute("src") !== next) item.frame.src = next;
      });
      backBtn.disabled = tab.index <= 0;
      reloadBtn.disabled = tab.index < 0;
      renderTabs();
      remember();
    }

    function renderTabs() {
      tablist.innerHTML = "";
      tabs.forEach((tab, i) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "tab" + (i === active ? " on" : "");
        const name = document.createElement("span");
        name.textContent = tabLabel(tab);
        const close = document.createElement("i");
        close.textContent = "×";
        close.onclick = (e) => {
          e.stopPropagation();
          closeTab(i);
        };
        btn.appendChild(name);
        btn.appendChild(close);
        btn.onclick = () => {
          active = i;
          paint();
        };
        tablist.appendChild(btn);
      });
    }

    function addTab(history, index) {
      const frame = document.createElement("iframe");
      frame.title = "页面";
      stage.appendChild(frame);
      const tab = { history: history.slice(), index, frame };
      tabs.push(tab);
      return tab;
    }

    function closeTab(i) {
      const tab = tabs[i];
      tab.frame.remove();
      tabs.splice(i, 1);
      if (!tabs.length) addTab([], -1);
      if (i < active) active -= 1;
      else if (active >= tabs.length) active = tabs.length - 1;
      paint();
    }

    function openUrl(text) {
      const tab = current();
      const url = pageUrl(text);
      if (!url) {
        tab.history.splice(0, tab.history.length);
        tab.index = -1;
        paint();
        return;
      }
      if (tab.history[tab.index] === url) {
        tab.frame.src = url;
        return;
      }
      tab.history.splice(tab.index + 1);
      tab.history.push(url);
      tab.index = tab.history.length - 1;
      paint();
    }

    function recall() {
      const raw = sessionStorage.getItem(STORE);
      if (!raw) {
        addTab([], -1);
        return;
      }
      const data = JSON.parse(raw);
      if (!Array.isArray(data.tabs) || typeof data.active !== "number") throw new Error("浏览器记录坏了");
      data.tabs.forEach((tab) => {
        if (!Array.isArray(tab.history) || typeof tab.index !== "number") throw new Error("浏览器记录坏了");
        tab.history.forEach((url) => {
          if (typeof url !== "string" || !/^https?:\/\//i.test(url)) throw new Error("浏览器记录坏了");
        });
        if (tab.index < -1 || tab.index >= tab.history.length) throw new Error("浏览器记录坏了");
        addTab(tab.history, tab.index);
      });
      if (!tabs.length) addTab([], -1);
      if (data.active < 0 || data.active >= tabs.length) throw new Error("浏览器记录坏了");
      active = data.active;
    }

    document.getElementById("go").onclick = () => openUrl(input.value);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") openUrl(input.value);
    });
    backBtn.onclick = () => {
      const tab = current();
      if (tab.index <= 0) return;
      tab.index -= 1;
      paint();
    };
    reloadBtn.onclick = () => {
      const tab = current();
      if (tab.index < 0) return;
      tab.frame.src = tab.history[tab.index];
    };
    document.getElementById("add").onclick = () => {
      addTab([], -1);
      active = tabs.length - 1;
      paint();
    };
    window.addEventListener("message", (event) => {
      const from = tabs.findIndex((tab) => tab.frame.contentWindow === event.source);
      if (from < 0) return;
      if (!event.data || (event.data.type !== "browser-go" && event.data.type !== "browser-tab")) return;
      const url = pageUrl(event.data.url);
      if (!url) throw new Error("没有网址");
      if (event.data.type === "browser-tab") {
        addTab([url], 0);
        active = tabs.length - 1;
        paint();
        return;
      }
      const tab = tabs[from];
      if (tab.history[tab.index] === url) return;
      tab.history.splice(tab.index + 1);
      tab.history.push(url);
      tab.index = tab.history.length - 1;
      active = from;
      paint();
    });
    recall();
    paint();
  </script>
</body>
</html>
