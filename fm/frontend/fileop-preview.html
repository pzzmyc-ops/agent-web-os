<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>复制进度对照</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #d6d6d6;
      font-family: "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
    }
    body { display: flex; align-items: center; justify-content: center; }
    .win {
      width: 450px;
      background: #fff;
      border: 1px solid #9c9c9c;
      box-shadow: 0 8px 28px rgba(0, 0, 0, .28);
      color: #1a1a1a;
      user-select: none;
    }
    .caption {
      height: 30px;
      display: flex;
      align-items: center;
      padding-left: 8px;
      cursor: move;
    }
    .ico { width: 16px; height: 16px; flex-shrink: 0; }
    .cap-title { flex: 1; margin-left: 8px; font-size: 12px; }
    .cap-btn {
      width: 46px; height: 30px; border: 0; background: transparent; cursor: pointer; color: #1a1a1a; font-size: 12px;
    }
    .cap-btn:hover { background: #e6e6e6; }
    .cap-btn.close:hover { background: #e81123; color: #fff; }
    .cap-btn.dim { color: #9a9a9a; }
    .min-mark { display: block; width: 10px; height: 1px; background: currentColor; margin: 0 auto; }
    .max-mark { display: block; width: 10px; height: 10px; border: 1px solid currentColor; margin: 0 auto; }
    .body { padding: 6px 24px 0 24px; }
    .sentence { font-size: 12px; line-height: 1.45; }
    .link { color: #0067c0; }
    .row {
      margin-top: 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .row .pct { font-size: 18px; }
    .tools { display: flex; align-items: center; gap: 12px; }
    .pause {
      width: 24px; height: 22px; border: 1px solid #333; background: #fff; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 3px; padding: 0;
    }
    .pause i { width: 2px; height: 10px; background: #1a1a1a; display: block; }
    .pause.resume i { display: none; }
    .pause.resume::before {
      content: "";
      border-style: solid;
      border-width: 5px 0 5px 9px;
      border-color: transparent transparent transparent #1a1a1a;
    }
    .stop {
      width: 22px; height: 22px; border: 0; background: transparent; cursor: pointer;
      font-size: 16px; line-height: 1; color: #1a1a1a;
    }
    .meter {
      position: relative;
      height: 78px;
      margin-top: 8px;
      border: 1px solid #a3a3a3;
      background: #fff;
    }
    .meter canvas { display: block; width: 100%; height: 100%; }
    .speed {
      position: absolute;
      right: 6px;
      top: 0;
      font-size: 12px;
      line-height: 16px;
      color: #1a1a1a;
      padding: 0 3px;
      white-space: nowrap;
      pointer-events: none;
    }
    .speed[hidden] { display: none; }
    .meta { margin-top: 14px; font-size: 12px; line-height: 1.75; }
    .more {
      width: 100%;
      height: 34px;
      margin-top: 8px;
      border: 0;
      border-top: 1px solid #e2e2e2;
      background: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 14px;
      font-size: 12px;
      color: #1a1a1a;
      font-family: inherit;
    }
    .chev {
      width: 16px; height: 16px; border: 1px solid #8a8a8a; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .chev::before {
      content: "";
      border-style: solid;
      border-width: 0 4px 5px 4px;
      border-color: transparent transparent #555 transparent;
      transform: translateY(-1px);
    }
    .win.brief .meta { display: none; }
    .win.brief .chev::before {
      border-width: 5px 4px 0 4px;
      border-color: #555 transparent transparent transparent;
      transform: translateY(1px);
    }
  </style>
</head>
<body>
  <div class="win" id="dlg">
    <div class="caption" id="cap">
      <svg class="ico" viewBox="0 0 16 16" aria-hidden="true">
        <path fill="#2f7fd1" d="M2 3h5l1 1h6v8H2z" />
        <path fill="#5aa6e6" d="M3 6h9v5H3z" />
      </svg>
      <span class="cap-title" id="cap-title">已完成 0%</span>
      <button type="button" class="cap-btn" title="最小化"><span class="min-mark"></span></button>
      <button type="button" class="cap-btn dim" title="最大化"><span class="max-mark"></span></button>
      <button type="button" class="cap-btn close" title="关闭">×</button>
    </div>
    <div class="body">
      <div class="sentence">正在将 <span id="count">174,110</span> 个项目从 <span class="link">本地磁盘 (D:)</span> 移动到 <span class="link">新加卷 (F:)</span></div>
      <div class="row">
        <span class="pct" id="pct">已完成 0%</span>
        <span class="tools">
          <button type="button" class="pause" id="pause" title="暂停"><i></i><i></i></button>
          <button type="button" class="stop" title="取消">×</button>
        </span>
      </div>
      <div class="meter" id="meter">
        <canvas id="chart"></canvas>
        <div class="speed" id="speed">速度: 正在计算</div>
      </div>
      <div class="meta">
        <div>名称: <span id="name">resized_1109.jpg</span></div>
        <div>剩余时间: <span id="eta">正在计算...</span></div>
        <div>剩余项目: <span id="left">174,110 (355 GB)</span></div>
      </div>
    </div>
    <button type="button" class="more" id="more"><span class="chev"></span><span id="more-text">简略信息</span></button>
  </div>
  <script>
    var dlg = document.getElementById("dlg");
    var cap = document.getElementById("cap");
    var canvas = document.getElementById("chart");
    var ctx = canvas.getContext("2d");

    function fmtSize(n) {
      var u = ["B", "KB", "MB", "GB", "TB"];
      var i = 0;
      var v = n;
      while (v >= 1024 && i < u.length - 1) { v /= 1024; i += 1; }
      return (i === 0 ? Math.round(v) : v.toFixed(1)) + " " + u[i];
    }
    function fmtCount(n) {
      return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    }
    function fmtEta(sec) {
      if (sec < 60) return "大约 " + Math.max(1, Math.round(sec)) + " 秒";
      var m = Math.round(sec / 60);
      if (m < 60) return "大约 " + m + " 分钟";
      var h = Math.floor(m / 60);
      var rm = m - h * 60;
      return rm ? "大约 " + h + " 小时 " + rm + " 分钟" : "大约 " + h + " 小时";
    }

    var samples = [];
    var peak = 0;
    var axisMax = 0;
    var axisStep = 0;
    var speedEl = document.getElementById("speed");

    function niceStep(raw) {
      var mag = Math.pow(10, Math.floor(Math.log(raw) / Math.LN10));
      var candidates = [1, 2, 5, 10];
      for (var i = 0; i < candidates.length; i += 1) {
        if (candidates[i] * mag >= raw) return candidates[i] * mag;
      }
      return 10 * mag;
    }

    function lockAxis(peakSpeed) {
      var target = peakSpeed * 1.1;
      var step = niceStep(target / 8);
      var max = Math.ceil(target / step) * step;
      if (max / step < 6) {
        step = niceStep(target / 10);
        max = Math.ceil(target / step) * step;
      }
      axisStep = step;
      axisMax = max;
    }

    function drawChart(fraction, currentSpeed, paused) {
      var w = canvas.clientWidth;
      var h = canvas.clientHeight;
      var ratio = window.devicePixelRatio || 1;
      if (canvas.width !== Math.round(w * ratio) || canvas.height !== Math.round(h * ratio)) {
        canvas.width = Math.round(w * ratio);
        canvas.height = Math.round(h * ratio);
      }
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, w, h);

      var scale = axisMax > 0 ? axisMax : (peak > 0 ? peak * 1.1 : 1);
      var lineY = currentSpeed > 0 ? h - Math.min(1, currentSpeed / scale) * h : h;

      var light = paused ? "#f3e6a3" : "#b6e7b6";
      var dark = paused ? "#d3b23a" : "#2fbe44";
      for (var i = 0; i < samples.length; i += 1) {
        var s = samples[i];
        var x0 = Math.floor(s.from * w);
        var x1 = Math.ceil(s.to * w);
        var top = h - Math.min(1, s.speed / scale) * h;
        if (x1 <= x0) x1 = x0 + 1;
        if (top < lineY) {
          ctx.fillStyle = light;
          ctx.fillRect(x0, top, x1 - x0, lineY - top);
          ctx.fillStyle = dark;
          ctx.fillRect(x0, lineY, x1 - x0, h - lineY);
        } else {
          ctx.fillStyle = dark;
          ctx.fillRect(x0, top, x1 - x0, h - top);
        }
      }

      ctx.strokeStyle = paused ? "rgba(170, 140, 30, .22)" : "rgba(0, 0, 0, .10)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      if (axisStep > 0) {
        for (var level = axisStep; level < scale; level += axisStep) {
          var gy = Math.round(h - (level / scale) * h) + 0.5;
          ctx.moveTo(0, gy);
          ctx.lineTo(w, gy);
        }
      }
      var step = w / 6;
      for (var gx = step; gx < w - 1; gx += step) {
        var px = Math.round(gx) + 0.5;
        ctx.moveTo(px, 0);
        ctx.lineTo(px, h);
      }
      ctx.stroke();

      if (currentSpeed > 0 && !paused) {
        ctx.strokeStyle = "#1c7a2b";
        ctx.lineWidth = 1;
        ctx.beginPath();
        var ly = Math.round(lineY) + 0.5;
        ctx.moveTo(0, ly);
        ctx.lineTo(w, ly);
        ctx.stroke();
        speedEl.hidden = false;
        var labelTop = Math.round(lineY) - 17;
        if (labelTop < 0) labelTop = Math.round(lineY) + 2;
        if (labelTop > h - 16) labelTop = h - 16;
        speedEl.style.top = labelTop + "px";
      } else {
        speedEl.hidden = true;
      }
    }

    var total = 355 * 1024 * 1024 * 1024;
    var files = 174110;
    var done = 0;
    var doneFiles = 0;
    var paused = false;
    var elapsed = 0;
    var lastFrac = 0;
    var recent = [];
    var lastSpeed = 0;
    var names = ["resized_1109.jpg", "resized_1110.jpg", "resized_1111.jpg", "IMG_2044.CR2", "IMG_2045.CR2", "cache.bin", "notes.txt", "clip_0031.mp4"];

    function speedAt(t) {
      var base = 140 * 1024 * 1024;
      var burst = t < 1.5 ? 220 * 1024 * 1024 * (1 - t / 1.5) : 0;
      var wave = Math.sin(t / 2.3) * 25 * 1024 * 1024 + Math.sin(t / 0.7) * 12 * 1024 * 1024;
      var dip = (Math.floor(t / 6) % 3 === 2) ? -80 * 1024 * 1024 : 0;
      return Math.max(8 * 1024 * 1024, base + burst + wave + dip);
    }

    function tick() {
      if (!paused) {
        var dt = 0.25;
        elapsed += dt;
        var sp = speedAt(elapsed);
        var demoScale = 90;
        var moved = sp * dt * demoScale;
        done = Math.min(total, done + moved);
        doneFiles = Math.min(files, doneFiles + Math.round(moved / (total / files)));
        var frac = done / total;
        if (sp > peak) peak = sp;
        if (axisMax === 0 && elapsed >= 1) lockAxis(peak);
        samples.push({ from: lastFrac, to: frac, speed: sp });
        lastFrac = frac;
        recent.push({ t: elapsed, b: done });
        while (recent.length && elapsed - recent[0].t > 3) recent.shift();
        var shown = 0;
        if (recent.length > 1) {
          var a = recent[0];
          var b = recent[recent.length - 1];
          shown = (b.b - a.b) / (b.t - a.t) / demoScale;
        }
        var pct = Math.floor(frac * 100);
        lastSpeed = sp;
        document.getElementById("pct").textContent = "已完成 " + pct + "%";
        document.getElementById("cap-title").textContent = "已完成 " + pct + "%";
        speedEl.textContent = shown > 0 ? "速度: " + fmtSize(shown) + "/秒" : "速度: 正在计算";
        document.getElementById("name").textContent = names[Math.floor(elapsed * 2) % names.length];
        document.getElementById("left").textContent = fmtCount(files - doneFiles) + " (" + fmtSize(total - done) + ")";
        document.getElementById("eta").textContent = elapsed < 8 || shown <= 0 ? "正在计算..." : fmtEta((total - done) / shown / demoScale);
        drawChart(frac, sp, false);
        if (done >= total) return;
      }
      setTimeout(tick, 250);
    }

    document.getElementById("pause").addEventListener("click", function () {
      paused = !paused;
      this.classList.toggle("resume", paused);
      this.title = paused ? "继续" : "暂停";
      var pctNow = Math.floor((done / total) * 100);
      if (paused) {
        document.getElementById("pct").textContent = "已暂停 - 已完成 " + pctNow + "%";
        document.getElementById("cap-title").textContent = "已暂停 - 已完成 " + pctNow + "%";
        drawChart(done / total, lastSpeed, true);
      } else {
        document.getElementById("pct").textContent = "已完成 " + pctNow + "%";
        document.getElementById("cap-title").textContent = "已完成 " + pctNow + "%";
        recent = [];
        drawChart(done / total, lastSpeed, false);
      }
    });

    cap.addEventListener("pointerdown", function (e) {
      if (e.button !== 0 || e.target.closest("button")) return;
      var rect = dlg.getBoundingClientRect();
      var dx = e.clientX - rect.left;
      var dy = e.clientY - rect.top;
      dlg.style.position = "fixed";
      dlg.style.margin = "0";
      function move(ev) {
        dlg.style.left = (ev.clientX - dx) + "px";
        dlg.style.top = (ev.clientY - dy) + "px";
      }
      function up() {
        window.removeEventListener("pointermove", move);
        window.removeEventListener("pointerup", up);
      }
      window.addEventListener("pointermove", move);
      window.addEventListener("pointerup", up);
    });
    document.getElementById("more").addEventListener("click", function () {
      var brief = dlg.classList.toggle("brief");
      document.getElementById("more-text").textContent = brief ? "详细信息" : "简略信息";
    });

    drawChart(0, 0, false);
    setTimeout(tick, 250);
    if (location.hash === "#paused") {
      setTimeout(function () { document.getElementById("pause").click(); }, 4200);
    }
  </script>
</body>
</html>
